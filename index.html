<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Glass Site</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <button class="hamburger" id="hamburger" aria-label="Toggle menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>

  <div class="overlay" id="overlay"></div>

  <nav class="side-panel" id="sidePanel">
    <div class="logo">LOGO</div>
    <ul>
      <li><a href="#home" class="nav-link active">Home</a></li>
      <li><a href="#about" class="nav-link">About</a></li>
      <li><a href="#services" class="nav-link">Services</a></li>
      <li><a href="#contact" class="nav-link">Contact</a></li>
    </ul>
  </nav>

  <header class="floating-nav">
    <nav class="nav-pills">
      <div class="nav-item">
        <a href="#home" class="nav-link-pill active">Home</a>
      </div>
      <div class="search-wrapper">
        <form class="search-container" id="searchForm" role="search">
          <label for="searchInput" class="sr-only">Search</label>
          <input type="search" id="searchInput" class="search-input" placeholder="Search..." required>
          <button type="submit" class="search-trigger" aria-label="Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
          </button>
        </form>
      </div>
      <div class="nav-item">
        <a href="#contact" class="nav-link-pill">Contact</a>
      </div>
    </nav>
  </header>

  <main class="content">
    <div class="hero">
      <h1>Premium Glassmorphism</h1>
      <p>Side Panel + Search Bar Perfect ✅</p>
    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
